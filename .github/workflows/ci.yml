# Build and test validation for every pull request, and for main once a pull
# request lands on it, so the branch a publish is cut from carries the same
# checks the change was reviewed with.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request that is pushed to again only needs its newest commit tested,
# and the e2e shards below are too heavy to leave running for a commit nobody will
# merge. Runs on main are never cancelled, so every commit there keeps its
# own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The e2e suite runs in its own job below; vetting it here as well
      # catches a suite that no longer compiles without waiting for a client
      # image to download.
      - name: Vet the e2e suite
        run: go vet -tags e2e ./e2e

      - name: Test
        run: go test -race -count=1 ./...

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built for the runner's platform only and never pushed: the point is
      # that the Dockerfile still produces an image from this change, and the
      # multi-platform build is left to the publish workflow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The e2e suite launches a real client for every release name the server
  # answers to, which is most of an hour on one runner. The matrix deals the
  # releases out to this many runners instead, and the run takes as long as one
  # share does. The count lives here alone: E2E_SHARD below carries it to the
  # suite, which does the dealing.
  e2e-shard:
    name: Join with a real client (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard failing says nothing about the releases in the others, and
      # their verdicts are worth having in the same run.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD_COUNT: 8
    # A share is a handful of versions, minutes of work after the image
    # download; the suite's own timeout is the ceiling, and this is a little
    # above it so a hung run is reported by the suite rather than the runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The offline client image is several gigabytes compressed and about
      # seven unpacked, and a pull holds both at once for a moment. The runner
      # ships with toolchains this job never touches, and dropping them makes
      # room for the image with plenty to spare.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Pulled ahead of the suite so the download has its own step and log,
      # and the launch timeouts inside the suite measure the client alone.
      - name: Pull the client image
        run: docker pull --quiet ghcr.io/void-community/portable-minecraft-client:offline

      # Two clients at once is what a hosted runner's memory holds alongside
      # the anchor the position sync test keeps in the world.
      - name: Test with a real client of this shard's versions
        env:
          E2E_CLIENTS: "2"
          E2E_SHARD: ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: go test -tags e2e -count=1 -timeout 30m -v ./e2e

  # The one check the shards answer to. The ruleset on main requires a check
  # of this name, and a matrix reports one per shard under names that change
  # with the shard count, so this job stands for all of them: it passes only
  # when every shard did, and fails -- rather than being skipped, which a
  # required check counts as passing -- when one failed or was cancelled.
  e2e:
    name: Join with a real client
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ always() }}
    steps:
      - name: Check every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "the shards finished with: $RESULT"
          [ "$RESULT" = "success" ]
